<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Calculator Pro</title>
    <link rel="icon" href="favicon.png">

    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <!-- Encabezado de la calculadora -->
    <main class="calculator">

        <h1> Calculator</h1>
        <div id="clock"></div>

        <!-- Pantalla de resultados -->
        <section class="display">
            <input type="text" id="display" readonly>
        </section>

        <!-- Botones de la calculadora -->
        <section class="buttons">

            <button class="operator" aria-label="Borrar todo">AC</button>
            <button class="operator" aria-label="Borrar último">⌫</button>
            <button class="operator" aria-label="Porcentaje">%</button>
            <button class="operator" aria-label="Dividir">÷</button>

            <button aria-label="Número siete">7</button>
            <button aria-label="Número ocho">8</button>
            <button aria-label="Número nueve">9</button>
            <button class="operator" aria-label="Multiplicar">×</button>

            <button aria-label="Número cuatro">4</button>
            <button aria-label="Número cinco">5</button>
            <button aria-label="Número seis">6</button>
            <button class="operator" aria-label="Restar">−</button>

            <button aria-label="Número uno">1</button>
            <button aria-label="Número dos">2</button>
            <button aria-label="Número tres">3</button>
            <button class="operator" aria-label="Sumar">+</button>

            <button aria-label="Número cero">0</button>
            <button aria-label="Decimal">.</button>
            <button class="equal" aria-label="Calcular">=</button>

            <button id="modoBtn" class="modo" aria-label="Alternar modo oscuro o claro">🌙 Modo oscuro</button>

        </section>

    </main>

    <!-- Elementos auxiliares -->
    <audio id="clickSound">
        <source src="https://actions.google.com/sounds/v1/cartoon/wood_plank_flicks.ogg" type="audio/ogg">
    </audio>

    <!-- Scripts -->
    <script src="script.js"></script>

</body>
</html>
